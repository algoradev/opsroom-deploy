<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installing OpsRoom…</title>
<style>
  :root{--bg:#f6f6f4;--ink:#1c1c1a;--mut:#6b6b66;--line:#e3e3de;--done:#3b7d4f;--blocked:#b0463b;
        --errbg:#fbe9e7;--errline:#d97a6e;--errink:#8a2f24}
  @media (prefers-color-scheme: dark){
    :root{--bg:#161614;--ink:#eceae4;--mut:#98968e;--line:#33332e;--done:#6fbf8a;--blocked:#d97a6e;
          --errbg:#3a201c;--errline:#d97a6e;--errink:#f2b3a8}}
  *{box-sizing:border-box}
  body{margin:0;padding:4rem 1rem;background:var(--bg);color:var(--ink);
       font:15px/1.6 ui-sans-serif,system-ui,sans-serif;text-align:center}
  main{max-width:560px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:2.5rem 0 .3rem}
  .bar>i{display:block;height:100%;width:0;background:var(--ink);border-radius:5px;transition:width .4s ease-out}
  .bar.err>i{background:var(--blocked)}
  #pct{font-size:.8rem;color:var(--mut)}
  #step{color:var(--mut);min-height:1.5em;margin-top:1rem}
  .ok{color:var(--done);font-weight:600}
  .err{background:var(--errbg);border:1px solid var(--errline);color:var(--errink);
       padding:.8rem;border-radius:6px;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <h1>Installing OpsRoom</h1>
  <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
  <div id="pct">0%</div>
  <p id="step" aria-live="polite">starting…</p>
</main>
<script>
// Optimistic progress: eases toward 95% over ~10 min so early progress
// feels responsive, then snaps to 100% the instant the install reports
// done (whether that is at 4 minutes or 10), and freezes red on error.
// The bar reassures; the step text below it always tells the actual truth.
const t0 = Date.now(); let finished = false;
const fill = document.getElementById('fill'), pctEl = document.getElementById('pct');
function creep(){
  if(finished) return;
  const t = (Date.now()-t0)/1000;              // seconds elapsed
  const p = 95*(1 - Math.exp(-t/200));         // ease-out, ~95% near 10 min
  fill.style.width = p.toFixed(1)+'%'; pctEl.textContent = Math.floor(p)+'%';
  setTimeout(creep, 250);
}
creep();
async function poll(){
  try{
    const r = await fetch('/status',{cache:'no-store'}); const {status} = await r.json();
    const step = document.getElementById('step');
    if(status.startsWith('done:')){
      finished = true; const url = status.slice(5);
      fill.style.width='100%'; pctEl.textContent='100%';
      step.innerHTML = '<span class="ok">Ready.</span> Taking you to OpsRoom…';
      handover(url);
      return;
    }
    if(status.startsWith('error:')){
      finished = true; document.getElementById('bar').classList.add('err');
      step.innerHTML = '<div class="err">Install failed:<br>'+status.slice(6)+'</div>';
      return;
    }
    step.textContent = status.replace(/^installing:/,'');
  }catch(e){ /* :443 may be handing over to the product; keep trying */ }
  setTimeout(poll, 2000);
}
// After "done", :443 moves from this setup server to the product — a
// kill, a serve reset, and a new mapping, taking a few seconds. Going
// there on a timer used to land on whatever held the port at that instant
// (an empty form, or a connection error). Instead: probe the URL until the
// reply comes from something that is NOT this server (no X-OpsRoom-Setup
// header), then go. Cap at 90s so a stuck handover still ends in a browser
// showing the real state of :443 rather than this page forever.
async function handover(url){
  const t1 = Date.now();
  for(;;){
    try{
      const r = await fetch(url, {cache:'no-store', redirect:'follow'});
      if(r.ok && !r.headers.get('x-opsroom-setup')) break;
    }catch(e){ /* mid-handover: nothing on :443 yet */ }
    if(Date.now()-t1 > 90000) break;
    await new Promise(res => setTimeout(res, 1500));
  }
  location.href = url;
}
poll();
</script>
</body>
</html>
