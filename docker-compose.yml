    networks:
      asunset: null
    restart: unless-stopped
  opsroom-postgres:
    environment:
      POSTGRES_DB: opsroom
      POSTGRES_PASSWORD: ${OPSROOM_PG_PASSWORD:?set OPSROOM_PG_PASSWORD}
      POSTGRES_USER: opsroom
    healthcheck:
      interval: 5s
      retries: 20
      test:
      - CMD-SHELL
      - pg_isready -U opsroom
      timeout: 3s
    image: postgres:16-alpine
    networks:
      asunset: null
    restart: unless-stopped
    volumes:
    - source: opsroom-pg-data
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
  opsroom-projects-backfill:
    command: opsroom-v2 projects backfill
