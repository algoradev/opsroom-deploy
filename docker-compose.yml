      KEYCLOAK_API_CLIENT_ID: opsroom-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}/realms/${KEYCLOAK_REALM:-asunset}
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-}/realms/${KEYCLOAK_REALM:-asunset}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-asunset}
      OPENFGA_API_KEY: ${OPENFGA_API_KEY:?set OPENFGA_API_KEY}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-asunset}
      OPSROOM_ASUNSET_ORG_ID: ${OPSROOM_ASUNSET_ORG_ID:-}
      OPSROOM_ASUNSET_PG_DSN: postgresql://${APP_DB_OWNER:?set APP_DB_OWNER (asunset owner role, from
        the co-hosted .env)}:${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD}@postgres:5432/${APP_DB_NAME:?set
        APP_DB_NAME}
      OPSROOM_DECLARATION_STORE: ${OPSROOM_DECLARATION_STORE:-db}
      OPSROOM_ENV: ${OPSROOM_ENV:-production}
      OPSROOM_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-asunset}
      OPSROOM_KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      OPSROOM_OPENFGA_API_KEY: ${OPENFGA_API_KEY:?set OPENFGA_API_KEY}
      OPSROOM_OPENFGA_URL: http://openfga:8080
      OPSROOM_V2_PG_DSN: postgresql://opsroom:${OPSROOM_PG_PASSWORD:?set OPSROOM_PG_PASSWORD}@opsroom-postgres:5432/opsroom
      SESSION_TOKEN_PRIVATE_KEY_B64: ${SESSION_TOKEN_PRIVATE_KEY_B64:-}
    image: ${OPSROOM_REGISTRY:?set OPSROOM_REGISTRY, e.g. ghcr.io/algoradev}/opsroom-api:${OPSROOM_TAG:?set
      OPSROOM_TAG to a release version, e.g. 0.1.1 (no v prefix)}
    networks:
      asunset: null
    profiles:
    - ops
    volumes:
    - source: opsroom_home
      target: /var/lib/opsroom
      type: volume
      volume: {}
  opsroom-renderer:
    image: ${OPSROOM_REGISTRY:?set OPSROOM_REGISTRY, e.g. ghcr.io/algoradev}/opsroom-renderer:${OPSROOM_TAG:?set
      OPSROOM_TAG to a release version, e.g. 0.1.1 (no v prefix)}
    networks:
      asunset: null
    restart: unless-stopped
  opsroom-tenancy:
    command: opsroom-v2 tenancy --host 0.0.0.0 --port 8011
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      keycloak-init:
        condition: service_completed_successfully
        required: true
      openfga:
        condition: service_started
        required: true
      opsroom-api:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      APP_ADMIN_DB_URL: postgresql+asyncpg://${APP_DB_OWNER:-asunset_owner}:${APP_DB_OWNER_PASSWORD:-}@postgres:5432/${APP_DB_NAME:-asunset}
      APP_DB_URL: postgresql+asyncpg://${APP_DB_USER:-asunset}:${APP_DB_PASSWORD:-}@postgres:5432/${APP_DB_NAME:-asunset}
      APP_DB_USER: ${APP_DB_USER:-asunset}
      ASUNSET_ENV: ${ASUNSET_ENV:-prod}
      INVITE_DELIVERY: ${INVITE_DELIVERY:-temp_password}
      KEYCLOAK_API_CLIENT_ID: asunset-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}/realms/${KEYCLOAK_REALM:-asunset}
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-}/realms/${KEYCLOAK_REALM:-asunset}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-asunset}
      OPENFGA_API_KEY: ${OPENFGA_API_KEY:?set OPENFGA_API_KEY}
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_STORE_NAME: ${OPENFGA_STORE_NAME:-asunset}
      SESSION_TOKEN_PRIVATE_KEY_B64: ${SESSION_TOKEN_PRIVATE_KEY_B64:-}
    healthcheck:
      interval: 30s
      start_period: 30s
      test:
      - CMD
      - python
      - -c
      - import urllib.request as u; u.urlopen('http://127.0.0.1:8011/healthz', timeout=2)
      timeout: 3s
    image: ${OPSROOM_REGISTRY:?set OPSROOM_REGISTRY, e.g. ghcr.io/algoradev}/opsroom-api:${OPSROOM_TAG:?set
      OPSROOM_TAG to a release version, e.g. 0.1.1 (no v prefix)}
    networks:
      asunset: null
    restart: unless-stopped
  postgres:
    environment:
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_OWNER: ${APP_DB_OWNER}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      FGA_DB_NAME: ${FGA_DB_NAME}
      FGA_DB_PASSWORD: ${FGA_DB_PASSWORD}
      FGA_DB_USER: ${FGA_DB_USER}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_SUPERUSER}
      timeout: 5s
    image: postgres:16-alpine
    networks:
      asunset: null
    restart: unless-stopped
    volumes:
    - source: postgres-data
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
    - bind: {}
      read_only: true
      source: ./config/postgres-init
      target: /docker-entrypoint-initdb.d
      type: bind
  vector:
    command:
    - --config-dir
    - /etc/vector
    depends_on:
      keycloak:
        condition: service_started
        required: true
      openfga:
        condition: service_started
        required: true
    environment:
      VECTOR_LOG: ${VECTOR_LOG_LEVEL}
    image: timberio/vector:0.40.0-alpine
    networks:
      asunset: null
    restart: unless-stopped
    volumes:
    - bind: {}
      read_only: true
      source: ./config/vector.toml
      target: /etc/vector/vector.toml
      type: bind
    - bind: {}
      read_only: true
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      type: bind
volumes:
  caddy-data: {}
  keycloak-providers: {}
  keycloak-themes: {}
  opsroom-pg-data: {}
  opsroom_home: {}
  postgres-data: {}
